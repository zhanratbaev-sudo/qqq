<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <script src="lib/three.min.js"></script>
    <script src="lib/GLTFLoader.js"></script>
    <script src="lib/vi3d.js"></script>
    <style>
      @font-face { font-family: "VI Display"; src: local("Inter Display Black"), local("InterDisplay-Black"); font-weight: 900; }
      @font-face { font-family: "VI Display"; src: local("Inter Display Bold"), local("InterDisplay-Bold"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #08110f; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #08110f; font-family: "VI Display", sans-serif; color: #eef4f1; }
      #ph-gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="phone3d" data-width="1920" data-height="1080" data-start="0" data-duration="5.5">
      <canvas id="ph-gl" width="1920" height="1080"></canvas>
      <div id="ph-driver" class="clip" data-start="0" data-duration="5.5" data-track-index="0" style="position:absolute;width:1px;height:1px;opacity:0"></div>
    </div>
    <script>
      (function () {
        var V = VI3D.create(document.getElementById('ph-gl'), { bg: '#08110F', fov: 26 });
        var scr = VI3D.screen(1170, 2484);
        var imgs = {};
        // pX/pY в мировых единицах; b1/b2 — 0..1 появление баннеров
        var S = { pX: 4.8, pY: -4.2, pZ: 0, rY: -1.1, rX: 0.25, rZ: 0.12, cx: 0.9, cy: 0.1, cz: 9.6, lx: 0.9, ly: 0.1, b1: 0, b2: 0, exit: 0 };
        var phone;

        function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
        function banner(c, k, y, title, text) {
          if (k <= 0) return;
          var e = 1 - Math.pow(1 - Math.min(1, k), 4);
          var yy = y - (1 - e) * 260;
          c.save(); c.globalAlpha = Math.min(1, k * 2.5);
          c.shadowColor = 'rgba(0,0,0,0.28)'; c.shadowBlur = 40; c.shadowOffsetY = 12;
          rr(c, 36, yy, 1098, 230, 64); c.fillStyle = 'rgba(248,248,250,0.97)'; c.fill();
          c.shadowColor = 'transparent';
          if (imgs.icon) { c.save(); rr(c, 72, yy + 46, 120, 120, 28); c.clip(); c.drawImage(imgs.icon, 72, yy + 46, 120, 120); c.restore(); }
          c.fillStyle = '#111'; c.font = '700 46px "Inter SemiBold", "Inter", sans-serif'; c.fillText(title, 224, yy + 92);
          c.fillStyle = '#8a8a90'; c.font = '500 38px "Inter Medium", "Inter", sans-serif'; c.fillText('сейчас', 940, yy + 92);
          c.fillStyle = '#222'; c.font = '500 44px "Inter Medium", "Inter", sans-serif'; c.fillText(text, 224, yy + 160);
          c.restore();
        }
        var lastKey = '';
        function drawScreen() {
          // перерисовываем экран только когда меняются уведомления (загрузка текстуры дорогая)
          var key = S.b1.toFixed(3) + ',' + S.b2.toFixed(3);
          if (key === lastKey) return;
          lastKey = key;
          var c = scr.ctx, done = VI3D.phoneFrame(c, 1170, 2484);
          c.fillStyle = '#f2f2f7'; c.fillRect(0, 0, 1170, 2484);
          VI3D.drawScroll(c, imgs.app, 1170, 2484, 0, 1);
          banner(c, S.b2, 410, 'PetGo', 'Вам назначен заказ: Рекс, 10:00');
          banner(c, S.b1, 150, 'PetGo', 'Новая заявка: Жанар, корги');
          done();
          scr.tex.needsUpdate = true;
        }
        function render() {
          if (!phone) return;
          drawScreen();
          phone.position.set(S.pX, S.pY, S.pZ); phone.rotation.set(S.rX, S.rY, S.rZ);
          V.camera.position.set(S.cx, S.cy, S.cz); V.camera.lookAt(S.lx, S.ly, 0);
          V.render();
        }

        var tl = gsap.timeline({ paused: true });
        // телефон вылетает снизу справа и разворачивается экраном к зрителю
        tl.to(S, { pX: 2.6, pY: -0.05, rY: -0.32, rX: 0.04, rZ: 0, duration: 0.9, ease: 'expo.out' }, 0);
        tl.to(S, { rY: -0.2, duration: 1.6, ease: 'power2.inOut' }, 0.9);
        // 2.6: телефон подходит ближе, на 3.0 и 3.7 падают уведомления
        tl.to(S, { pZ: 1.3, pY: -0.35, rY: -0.12, duration: 0.8, ease: 'power2.inOut' }, 2.6);
        tl.to(S, { b1: 1, duration: 0.6, ease: 'none' }, 3.0);
        tl.to(S, { b2: 1, duration: 0.6, ease: 'none' }, 3.7);
        // уход: всё уходит в размытие, телефон улетает вверх
        tl.to(S, { pY: 5.5, rX: -0.4, duration: 0.4, ease: 'power3.in' }, 5.08);
        tl.eventCallback('onUpdate', render);

        Promise.all([
          VI3D.loadImage('assets/shots/app-home.png').then(function (i) { imgs.app = i; }),
          VI3D.loadImage('assets/petgo-icon.png').then(function (i) { imgs.icon = i; }),
        ]).then(function (r) {
          phone = VI3D.phone(scr);
          V.scene.add(phone);
          var sh = VI3D.contactShadow(2.6, 1.4, 0.5); sh.position.set(2.6, -1.75, 0); V.scene.add(sh);
          render();
          window.__timelines = window.__timelines || {};
          window.__timelines['phone3d'] = tl;
        });
      })();
    </script>
  </body>
</html>
