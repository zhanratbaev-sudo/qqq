  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var groups = document.querySelectorAll('#root .cap-g');
      groups.forEach(function (g) {
        var tIn = parseFloat(g.dataset.in), tOut = parseFloat(g.dataset.out);
        // заголовок: по словам, blur 8 → 0, 0.18 с, шаг 0.05 с
        var title = g.querySelector('.cap-t');
        var words = [];
        (function split(node) {
          Array.prototype.slice.call(node.childNodes).forEach(function (n) {
            if (n.nodeType === 3) {
              var parts = n.textContent.split(/(\s+)/);
              var frag = document.createDocumentFragment();
              parts.forEach(function (p) {
                if (!p) return;
                if (/^\s+$/.test(p)) { frag.appendChild(document.createTextNode(p)); return; }
                var s = document.createElement('span'); s.className = 'w'; s.textContent = p; frag.appendChild(s); words.push(s);
              });
              node.replaceChild(frag, n);
            } else if (n.nodeType === 1) split(n);
          });
        })(title);
        var single = words.length === 1;
        words.forEach(function (w, i) {
          // первое слово первого заголовка видно уже в кадре 0 (превью ролика)
          var first = tIn === 0 && i === 0;
          tl.fromTo(w, { opacity: first ? 1 : 0, filter: first ? 'blur(0px)' : 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.18, ease: 'power4.out' }, tIn + i * 0.05);
        });
        // описание(я): появляются в data-at, уходят в data-until (если задано); data-keep — без анимации (то же описание)
        g.querySelectorAll('.cap-d p').forEach(function (p) {
          var at = parseFloat(p.dataset.at), keep = p.hasAttribute('data-keep');
          tl.fromTo(p, { opacity: 0, filter: keep ? 'blur(0px)' : 'blur(8px)', y: 0 },
            { opacity: 1, filter: 'blur(0px)', y: 0, duration: keep ? 0.001 : 0.22, ease: 'power4.out' }, at);
          if (p.dataset.until) tl.to(p, { opacity: 0, filter: 'blur(8px)', duration: 0.15, ease: 'power3.in' }, parseFloat(p.dataset.until));
        });
        // уход всей группы: заголовок размывается; описание с data-keep у следующей группы стоит на месте
        if (tOut < 90) {
          var next = g.nextElementSibling;
          var keepDesc = next && next.querySelector('.cap-d p[data-keep]');
          tl.to(words, { opacity: 0, filter: 'blur(10px)', duration: single ? 0.12 : 0.15, ease: 'power3.in' }, tOut - (single ? 0.1 : 0.14));
          if (!keepDesc) tl.to(g.querySelectorAll('.cap-d p'), { opacity: 0, filter: 'blur(8px)', duration: 0.15, ease: 'power3.in' }, tOut - 0.14);
          else tl.to(g.querySelectorAll('.cap-d p'), { opacity: 0, duration: 0.001 }, parseFloat(keepDesc.dataset.at) + 0.001);
        }
      });
      window.__timelines['captions'] = tl;
    })();
  </script>
