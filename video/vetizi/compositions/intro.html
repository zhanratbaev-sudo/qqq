<template>
  <style>

    @font-face { font-family: "VI Display"; src: local("Inter Display Bold"), local("InterDisplay-Bold"); font-weight: 700; }
    /* Интро: пятна цвета WebFor собираются в знак, затем он переворачивается в иконку Vet.izi */
    #root { position: absolute; inset: 0; pointer-events: none; font-family: "VI Display", sans-serif; color: #f2f6f4; }
    .in-scr { position: absolute; left: 0; top: 0; width: 1920px; height: 1247px; transform-origin: 0 0; overflow: hidden; }
    .in-c { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: center; }

    #in-sub { top: 880px; font-weight: 700; font-size: 52px; color: #a9c9bf; }

  <div id="root" data-composition-id="intro" data-width="1920" data-height="1080">

      <div id="in-stage">

        <div class="in-tile" id="in-wt">
          <svg viewBox="0 0 120 120"><path id="in-w" d="M26 40 L42 84 L60 52 L78 84 L94 40" fill="none" stroke="#f4f1e4" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>

        <div class="in-tile" id="in-vt">

  <script>
    (function () {
      var scr = document.getElementById('in-scr');
      var T0 = 0;
      var tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 7.5);
      // 0.15–1.2: три пятна цвета логотипа влетают с разных сторон, кружат и стягиваются в одну точку
      [['#in-b1', -900, -300, 1.6], ['#in-b2', 900, 260, 1.4], ['#in-b3', -100, 700, 1.2]].forEach(function (b, i) {
        tl.fromTo(b[0], { x: b[1], y: b[2], scale: b[3], opacity: 0 }, { x: 0, y: 0, scale: 0.75, opacity: 1, duration: 1.0, ease: 'power3.inOut' }, 0.15 + i * 0.06);
      });
      tl.fromTo('#in-b1', { rotation: 0 }, { rotation: 140, duration: 1.1, ease: 'power2.inOut' }, 0.15);
      // 1.05–1.45: пятна сливаются и «застывают» в плитку: круг → скруглённый квадрат
      tl.to('.in-blob', { scale: 0.5, opacity: 0, duration: 0.35, ease: 'power2.in' }, 1.1);
      tl.fromTo('#in-wt', { opacity: 0, scale: 0.55, borderRadius: '50%', filter: 'blur(18px)' },

      tl.set('#in-ring', { opacity: 0 }, 0);
      tl.fromTo('#in-ring', { opacity: 0.9, scale: 0.95 }, { opacity: 0, scale: 1.8, duration: 0.9, ease: 'power2.out', immediateRender: false }, 1.45);
      // 1.5–1.95: буква W прорисовывается одним росчерком
      var w = document.getElementById('in-w'), len = 170;
      tl.fromTo(w, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.45, ease: 'power2.inOut' }, 1.5);
      tl.fromTo('#in-word', { opacity: 0, clipPath: 'inset(0 50% 0 50%)' }, { opacity: 1, clipPath: 'inset(0 0% 0 0%)', duration: 0.6, ease: 'power3.out' }, 1.85);
      tl.fromTo('#in-sub', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out' }, 2.35);
      tl.to(['#in-word', '#in-sub'], { opacity: 0, filter: 'blur(14px)', duration: 0.25, stagger: 0.04, ease: 'power3.in' }, 3.4);
      // 3.6–4.2: знак переворачивается — на обратной стороне иконка Vet.izi, лапка «отпечатывается» по пальцам
      tl.fromTo('#in-stage', { y: 0 }, { y: -20, duration: 0.3, ease: 'power2.out' }, 3.55);
      tl.to('#in-stage', { y: 0, duration: 0.3, ease: 'power2.in' }, 3.85);
      tl.fromTo('#in-wt', { rotationY: 0 }, { rotationY: 180, duration: 0.6, ease: 'power3.inOut' }, 3.6);
      tl.fromTo('#in-vt', { rotationY: -180 }, { rotationY: 0, duration: 0.6, ease: 'power3.inOut' }, 3.6);
      gsap.utils.toArray('#in-vt .in-toe').forEach(function (t, i) {
        tl.fromTo(t, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.25, ease: 'back.out(2.5)' }, 4.0 + i * 0.06);
      });
      tl.fromTo('#in-pre', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out' }, 3.75);
      tl.fromTo('#in-vword', { opacity: 0, y: 30, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.35, ease: 'power4.out' }, 4.45);
      tl.fromTo('#in-vsub', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.3, ease: 'power4.out' }, 4.85);
      tl.to(['#in-pre', '#in-vword', '#in-vsub'], { opacity: 0, filter: 'blur(14px)', duration: 0.25, ease: 'power3.in' }, 6.8);
      // иконка уходит вниз — туда, откуда выедет телефон
      tl.to('#in-stage', { y: 760, scale: 0.4, opacity: 0, duration: 0.5, ease: 'power3.in' }, 6.95);
      tl.eventCallback('onUpdate', function () { SCREEN.map(scr, T0 + tl.time()); });
      SCREEN.map(scr, T0);
      window.__timelines['intro'] = tl;
    })();
  </script>
