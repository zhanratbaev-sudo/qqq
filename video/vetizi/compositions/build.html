  <script>
    (function () {
      // строки кода: [класс, текст] сегменты; каждая строка «проявляет» блок каркаса
      var lines = [
        [['t', '<header'], ['a', ' class'], ['x', '='], ['s', '"nav"'], ['t', '>']],
        [['t', '<h1>'], ['x', 'Забота о питомцах'], ['t', '</h1>']],
        [['t', '<a'], ['a', ' class'], ['x', '='], ['s', '"btn"'], ['t', '>'], ['x', 'Записаться'], ['t', '</a>']],
        [['t', '<img'], ['a', ' src'], ['x', '='], ['s', '"hero.svg"'], ['t', '>']],
        [['t', '<section'], ['a', ' id'], ['x', '='], ['s', '"services"'], ['t', '>']],
        [['t', '<form'], ['a', ' id'], ['x', '='], ['s', '"request"'], ['t', '>']],
        [['c', '<!-- ваш стиль и цвета -->']],
      ];
      var reveal = [['#wf0'], ['#wf1', '#wf2'], ['#wf3'], ['#wf4'], ['#wf5'], ['#wf6'], []];
      var code = document.getElementById('bd-code');
      var chars = [];
      lines.forEach(function (ln) {
        var row = document.createElement('span'); row.className = 'bd-ln';
        var list = [];
        ln.forEach(function (seg) {
          seg[1].split('').forEach(function (ch) {
            var sp = document.createElement('span'); sp.className = 'bd-ch ' + seg[0]; sp.textContent = ch; row.appendChild(sp); list.push(sp);
          });
        });
        code.appendChild(row); chars.push(list);
      });

      var tl = gsap.timeline({ paused: true });
      // заголовок по словам
      gsap.utils.toArray('#bd-title .bd-tw').forEach(function (w, i) {
        tl.fromTo(w, { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.15, ease: 'power4.out' }, 0.18 + i * 0.07);
      });
      // окна въезжают: редактор слева, браузер справа (уменьшен до 884 px)
      var SMALL = 884 / 1600;
      tl.fromTo('#bd-editor', { opacity: 0, x: -60, filter: 'blur(10px)' }, { opacity: 1, x: 0, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' }, 0.0);
      tl.fromTo('#bd-browser', { opacity: 0, scale: SMALL, x: 780 + 60, y: 245 - 15 }, { opacity: 1, scale: SMALL, x: 780, y: 245 - 15, duration: 0.5, ease: 'expo.out' }, 0.08);
      gsap.utils.toArray('.wf').forEach(function (el) { tl.fromTo(el, { opacity: 0, scale: 0.92 }, { opacity: 0, scale: 0.92, duration: 0.01 }, 0); });
      tl.fromTo('#bd-site', { opacity: 0, filter: 'blur(12px)', y: 0 }, { opacity: 0, filter: 'blur(12px)', y: 0, duration: 0.01 }, 0);

      // печать: ~1.9 с на 7 строк; каретка следует за последним символом
      var t = 0.35, per = 0.021;
      var caret = document.getElementById('bd-caret');
      chars.forEach(function (list, li) {
        list.forEach(function (sp, ci) { tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, t + ci * per); });
        var tEnd = t + list.length * per;
        tl.fromTo(caret, { x: 30, y: 86 + li * 50 }, { x: 30 + list.length * 16.2, y: 86 + li * 50, duration: list.length * per, ease: 'none', immediateRender: false }, t);
        reveal[li].forEach(function (sel, k) {
          tl.fromTo(sel, { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, tEnd + k * 0.06);
        });
        t = tEnd + 0.04;
      });
      tl.to(caret, { opacity: 0, duration: 0.1 }, 2.35);
      // проявляется настоящий сайт (blur swap) и едет вниз
      tl.to('#bd-site', { opacity: 1, filter: 'blur(0px)', duration: 0.22, ease: 'power2.out' }, 2.3);
      tl.to('.wf', { opacity: 0, duration: 0.2 }, 2.4);
      tl.fromTo('#bd-label', { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.7)' }, 2.45);
      tl.to('#bd-site', { y: -760, duration: 1.1, ease: 'power2.inOut' }, 2.65);
      // браузер становится миром: растёт до размера следующей сцены, сайт доезжает до формы заявки
      tl.to('#bd-label', { opacity: 0, filter: 'blur(8px)', duration: 0.15, ease: 'power3.in' }, 3.8);
      tl.to(['#bd-title', '#bd-editor'], { opacity: 0, filter: 'blur(14px)', duration: 0.3, ease: 'power3.in' }, 3.85);
      tl.to('#bd-browser', { scale: 1, x: 0, y: 0, duration: 0.7, ease: 'power3.inOut' }, 3.85);
      tl.to('#bd-site', { y: -2859 * (1600 / 1440), duration: 0.7, ease: 'power3.inOut' }, 3.85);
      // липкая шапка сайта, как на живой странице в следующей сцене
      tl.fromTo('#bd-nav', { opacity: 0 }, { opacity: 1, duration: 0.25, ease: 'power2.out' }, 4.2);
      window.__timelines['build'] = tl;
    })();
