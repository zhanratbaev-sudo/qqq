  <script>
    (function () {
      var lines = [
        [['t', '<header'], ['a', ' class'], ['x', '='], ['s', '"nav"'], ['t', '>']],
        [['t', '<h1>'], ['x', 'Забота'], ['t', '</h1>']],
        [['t', '<a'], ['a', ' class'], ['x', '='], ['s', '"btn"'], ['t', '>']],
        [['t', '<img'], ['a', ' src'], ['x', '='], ['s', '"hero"'], ['t', '>']],
        [['t', '<section'], ['a', ' id'], ['x', '='], ['s', '"uslugi"'], ['t', '>']],
        [['t', '<form'], ['a', ' id'], ['x', '='], ['s', '"zayavka"'], ['t', '>']],
      ];
      var reveal = [['#wf0'], ['#wf1', '#wf2'], ['#wf3'], ['#wf4'], ['#wf5'], ['#wf6']];
      var code = document.getElementById('bd-code');
      var chars = [];
      lines.forEach(function (ln) {
        var row = document.createElement('span'); row.className = 'bd-ln';
        var list = [];
        ln.forEach(function (seg) {
          seg[1].split('').forEach(function (ch) {
            var sp = document.createElement('span'); sp.className = 'bd-ch ' + seg[0]; sp.textContent = ch; row.appendChild(sp); list.push(sp);
          });
        });
        code.appendChild(row); chars.push(list);
      });

      var K = 1120 / 1440; // масштаб страницы 1440 px в окне
      var tl = gsap.timeline({ paused: true });
      tl.fromTo('#bd-browser', { opacity: 0, scale: 0.94, filter: 'blur(12px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 0.5, ease: 'expo.out' }, 0.05);
      gsap.utils.toArray('.wf').forEach(function (el) { tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 0, scale: 0.9, duration: 0.01 }, 0); });
      tl.fromTo('#bd-site', { opacity: 0, filter: 'blur(12px)', y: 0 }, { opacity: 0, filter: 'blur(12px)', y: 0, duration: 0.01 }, 0);
      tl.fromTo('#bd-nav', { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);

      // печать кода: каждая строка проявляет свой блок сайта
      var t = 0.35, per = 0.018, cw = 12.6; // ширина символа JetBrains Mono 21 px
      var caret = document.getElementById('bd-caret');
      chars.forEach(function (list, li) {
        list.forEach(function (sp, ci) { tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: 'none' }, t + ci * per); });
        var tEnd = t + list.length * per;
        var cy = 26 + 18 + 18 + li * 40 + 7;
        tl.fromTo(caret, { x: 22, y: cy }, { x: 22 + list.length * cw, y: cy, duration: list.length * per, ease: 'none', immediateRender: false }, t);
        reveal[li].forEach(function (sel, k) {
          tl.fromTo(sel, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.6)', immediateRender: false }, tEnd + k * 0.06);
        });
        t = tEnd + 0.05;
      });
      // 1.95: проявляется настоящий сайт (пример — PetGo), панель кода уезжает
      tl.to('#bd-site', { opacity: 1, filter: 'blur(0px)', duration: 0.25, ease: 'power2.out' }, 1.95);
      tl.to('.wf', { opacity: 0, duration: 0.2 }, 2.05);
      tl.to('#bd-panel', { x: -440, duration: 0.45, ease: 'power3.inOut' }, 2.0);
      tl.to('#bd-site', { y: -620, duration: 0.9, ease: 'power2.inOut' }, 2.25);
      // 3.3: доезжаем до формы заявки — ровно тот кадр, с которого начинается следующая сцена
      tl.to('#bd-site', { y: -2859 * K, duration: 0.8, ease: 'power3.inOut' }, 3.3);
      tl.to('#bd-nav', { opacity: 1, duration: 0.25, ease: 'power2.out' }, 3.9);
      window.__timelines['build'] = tl;
    })();
