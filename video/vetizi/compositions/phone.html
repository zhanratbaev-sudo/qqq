<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <script src="lib/three.min.js"></script>
    <script src="lib/vi3d.js"></script>
    <script src="lib/screen.js"></script>
    <script src="lib/phoneui.js"></script>
    <script src="lib/caps.js"></script>
    <style>
      @font-face { font-family: "VI Display"; src: local("Inter Display Black"), local("InterDisplay-Black"); font-weight: 900; }
      @font-face { font-family: "VI Display"; src: local("Inter Display Bold"), local("InterDisplay-Bold"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; pointer-events: none; font-family: "VI Display", sans-serif; }
      .ph-scr { position: absolute; left: 0; top: 0; width: 1920px; height: 1247px; transform-origin: 0 0; overflow: hidden; }
      #ph-gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1247px; }
      /* надписи: колонка x 120–820, верх заголовка y 430 */
      .cap-g { position: absolute; left: 120px; top: 430px; width: 700px; display: flex; flex-direction: column; }
      .cap-t { font-weight: 900; font-size: 96px; line-height: 1.02; letter-spacing: -0.035em; color: #f2f6f4; white-space: nowrap; }
      .cap-t .w { display: inline-block; }
      .cap-d { position: relative; margin-top: 30px; height: 120px; }
      .cap-d p { position: absolute; left: 0; top: 0; width: 700px; font-weight: 700; font-size: 46px; line-height: 1.25; color: #b5ccc4; }
      .acc { color: #3fe0a0; }
    </style>
  </head>
  <body>
    <!-- Сцена, глобально 7.5–16.5 с: iPhone 16 Pro в чехле, установка Vet.izi, функции приложения -->
    <div id="root" data-composition-id="phone" data-width="1920" data-height="1080" data-start="0" data-duration="9">
      <div id="ph-driver" class="clip" data-start="0" data-duration="9" data-track-index="0" style="position:absolute;width:1px;height:1px;opacity:0"></div>
      <div class="ph-scr" id="ph-scr">
        <canvas id="ph-gl" width="1920" height="1247"></canvas>
        <div class="cap-g" data-in="8.0" data-out="12.25">
          <div class="cap-t">Приложение<br>для<br><span class="acc">сотрудников</span></div>
          <div class="cap-d"><p data-at="8.2" data-until="9.95">Vet.izi на телефоне вашей команды</p><p data-at="10.0">Установим за пару минут — без App Store</p></div>
        </div>
        <div class="cap-g" data-in="12.35" data-out="16.4">
          <div class="cap-t">Всё<br><span class="acc">под рукой</span></div>
          <div class="cap-d"><p data-at="12.7" data-until="13.92">Новые заявки с сайта</p><p data-at="14.0" data-until="15.12">Чат с командой</p><p data-at="15.2">Сотрудники и роли</p></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var T0 = 7.5;
        var root = document.getElementById('ph-scr');
        var V = VI3D.create(document.getElementById('ph-gl'), { alpha: true, fov: 26, w: 1920, h: 1247 });
        var scr = VI3D.screen(1170, 2484);
        var seqs = {};
        // px: телефон правее центра; py снизу — выезжает вверх (как в референсе)
        var S = { px: 1.45, py: -6.2, pz: 0, ry: -0.5, rx: 0.12, rz: 0.04, install: 0, tap: 0, flood: 0, splash: 0, req: -1, chat: -1, staff: -1, fade: 1 };
        var phone = null, last = '';
        function drawScreen() {
          var key = [S.install, S.tap, S.flood, S.splash, S.req, S.chat, S.staff].map(function (v) { return v.toFixed(3); }).join();
          if (key === last) return; last = key;
          var c = scr.ctx, done = VI3D.islandFrame(c, PUI.W, PUI.H);
          if (S.req < 0) {
            PUI.home(c, { install: S.install, tap: S.tap });
            if (S.flood > 0) PUI.flood(c, S.flood, S.splash);
          } else {
            PUI.seq(c, seqs.req, S.req);
            if (S.chat >= 0) PUI.seq(c, seqs.chat, S.chat, Math.min(1, S.chat * 12));
            if (S.staff >= 0) PUI.seq(c, seqs.staff, S.staff, Math.min(1, S.staff * 12));
          }
          done();
          scr.tex.needsUpdate = true;
        }
        function render() {
          SCREEN.map(root, T0 + tl.time());
          if (!phone) return;
          drawScreen();
          phone.position.set(S.px, S.py, S.pz); phone.rotation.set(S.rx, S.ry, S.rz);
          V.camera.position.set(0, 0, 11.2); V.camera.lookAt(0, 0, 0);
          V.render();
        }
        var tl = gsap.timeline({ paused: true });
        tl.set({}, {}, 9);
        // выезд снизу и доворот к зрителю (спинку не видно)
        tl.to(S, { py: -0.1, ry: -0.14, rx: 0.04, rz: 0, duration: 1.1, ease: 'expo.out' }, 0.1);
        tl.to(S, { ry: 0.16, duration: 0.8, ease: 'power2.inOut' }, 1.3);
        tl.to(S, { ry: -0.06, duration: 0.8, ease: 'power2.inOut' }, 2.1);
        // установка Vet.izi на главный экран (2.5–3.7)
        tl.fromTo(S, { install: 0 }, { install: 1, duration: 1.2, ease: 'none', immediateRender: false }, 2.5);
        // касание и раскрытие иконки (4.0–5.05)
        tl.fromTo(S, { tap: 0 }, { tap: 1, duration: 0.3, ease: 'none', immediateRender: false }, 4.0);
        tl.fromTo(S, { flood: 0 }, { flood: 1, duration: 0.6, ease: 'none', immediateRender: false }, 4.3);
        tl.fromTo(S, { splash: 0 }, { splash: 1, duration: 0.3, ease: 'none', immediateRender: false }, 4.75);
        tl.to(S, { pz: 0.9, px: 1.3, py: 0.05, ry: 0, duration: 0.8, ease: 'power2.inOut' }, 4.3);
        // функции приложения: кадры записи
        tl.fromTo(S, { req: -1 }, { req: 0, duration: 0.001, immediateRender: false }, 5.2);
        tl.fromTo(S, { req: 0 }, { req: 1, duration: 1.3, ease: 'none', immediateRender: false }, 5.201);
        tl.fromTo(S, { chat: -1 }, { chat: 0, duration: 0.001, immediateRender: false }, 6.5);
        tl.fromTo(S, { chat: 0 }, { chat: 1, duration: 1.2, ease: 'none', immediateRender: false }, 6.501);
        tl.fromTo(S, { staff: -1 }, { staff: 0, duration: 0.001, immediateRender: false }, 7.7);
        tl.fromTo(S, { staff: 0 }, { staff: 1, duration: 0.9, ease: 'none', immediateRender: false }, 7.701);
        tl.to(S, { ry: 0.08, duration: 1.2, ease: 'sine.inOut' }, 5.6);
        tl.to(S, { ry: -0.06, duration: 1.2, ease: 'sine.inOut' }, 6.8);
        // уход: экран телефона «перетекает» в градиент (morph.html, 16.05–16.45), под ним телефон прячется
        tl.to(S, { ry: 0, duration: 0.4, ease: 'power2.out' }, 8.1);
        tl.set(S, { py: -7 }, 8.98);
        CAPS.build(tl, root, T0);
        tl.eventCallback('onUpdate', render);

        Promise.all([
          PUI.loadSeq('assets/seq/app-req', 30).then(function (a) { seqs.req = a; }),
          PUI.loadSeq('assets/seq/app-chat', 32).then(function (a) { seqs.chat = a; }),
          PUI.loadSeq('assets/seq/app-staff', 21).then(function (a) { seqs.staff = a; }),
        ]).then(function () {
          phone = VI3D.phone16(scr);
          V.scene.add(phone);
          render();
          window.__timelines = window.__timelines || {};
          window.__timelines['phone'] = tl;
        });
      })();
    </script>
  </body>
</html>
