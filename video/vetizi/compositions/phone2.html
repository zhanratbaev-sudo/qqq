<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <script src="lib/three.min.js"></script>
    <script src="lib/vi3d.js"></script>
    <script src="lib/screen.js"></script>
    <script src="lib/phoneui.js"></script>
    <script src="lib/caps.js"></script>
    <style>
      @font-face { font-family: "VI Display"; src: local("Inter Display Black"), local("InterDisplay-Black"); font-weight: 900; }
      @font-face { font-family: "VI Display"; src: local("Inter Display Bold"), local("InterDisplay-Bold"); font-weight: 700; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; pointer-events: none; font-family: "VI Display", sans-serif; }
      .ph-scr { position: absolute; left: 0; top: 0; width: 1920px; height: 1247px; transform-origin: 0 0; overflow: hidden; }
      #ph-gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1247px; }
      /* надписи: колонка x 120–820, верх заголовка y 430 */
      .cap-g { position: absolute; left: 120px; top: 430px; width: 700px; display: flex; flex-direction: column; }
      .cap-t { font-weight: 900; font-size: 96px; line-height: 1.02; letter-spacing: -0.035em; color: #f2f6f4; white-space: nowrap; }
      .cap-t .w { display: inline-block; }
      .cap-d { position: relative; margin-top: 30px; height: 120px; }
      .cap-d p { position: absolute; left: 0; top: 0; width: 700px; font-weight: 700; font-size: 46px; line-height: 1.25; color: #b5ccc4; }
      .acc { color: #3fe0a0; }
    </style>
  </head>
  <body>
    <!-- Сцена, глобально 23–30 с: клиент заполняет заявку на телефоне, телефон делает оборот, заявка отправлена -->
    <div id="root" data-composition-id="phone2" data-width="1920" data-height="1080" data-start="0" data-duration="7">
      <div id="p2-driver" class="clip" data-start="0" data-duration="7" data-track-index="0" style="position:absolute;width:1px;height:1px;opacity:0"></div>
      <div class="ph-scr" id="p2-scr">
        <canvas id="p2-gl" width="1920" height="1247"></canvas>
        <div class="cap-g" data-in="23.3" data-out="29.9">
          <div class="cap-t">Клиент<br>оставляет<br><span class="acc">заявку</span></div>
          <div class="cap-d"><p data-at="23.5" data-until="26.55">Заполняет форму прямо с телефона</p><p data-at="27.85" data-until="28.95">Заявка отправлена</p><p data-at="29.0">…и сразу попадает в CRM</p></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var T0 = 23;
        var root = document.getElementById('p2-scr');
        var V = VI3D.create(document.getElementById('p2-gl'), { alpha: true, fov: 26, w: 1920, h: 1247 });
        var scr = VI3D.screen(1170, 2484);
        var seqs = {};
        // телефон плавно поднимается и проявляется
        var S = { px: 1.3, py: -0.9, pz: 0.6, ry: 0, rx: 0.03, rz: 0, form: 0, ok: -1 };
        var phone = null, last = '';
        function drawScreen() {
          var key = S.form.toFixed(3) + ',' + S.ok.toFixed(3);
          if (key === last) return; last = key;
          var c = scr.ctx, done = VI3D.islandFrame(c, PUI.W, PUI.H);
          if (S.ok < 0) PUI.seq(c, seqs.form, S.form);
          else PUI.seq(c, seqs.ok, S.ok);
          done();
          scr.tex.needsUpdate = true;
        }
        function render() {
          SCREEN.map(root, T0 + tl.time());
          if (!phone) return;
          drawScreen();
          phone.position.set(S.px, S.py, S.pz); phone.rotation.set(S.rx, S.ry, S.rz);
          V.camera.position.set(0, 0, 11.2); V.camera.lookAt(0, 0, 0);
          V.render();
        }
        var tl = gsap.timeline({ paused: true });
        tl.set({}, {}, 7);
        tl.fromTo('#p2-gl', { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.out' }, 0.05);
        tl.to(S, { py: 0.05, duration: 0.7, ease: 'power3.out' }, 0.05);
        tl.to(S, { ry: -0.1, duration: 0.6, ease: 'power2.out' }, 0.3);
        // клиент заполняет поля (запись с телефона, ускорено)
        tl.fromTo(S, { form: 0 }, { form: 1, duration: 2.8, ease: 'none', immediateRender: false }, 0.8);
        tl.to(S, { ry: 0.1, duration: 1.3, ease: 'sine.inOut' }, 1.1);
        tl.to(S, { ry: 0, duration: 1.2, ease: 'sine.inOut' }, 2.4);
        // полный оборот телефона: видно спинку с лапками
        tl.to(S, { ry: Math.PI * 2, py: 0.25, duration: 1.2, ease: 'power2.inOut' }, 3.6);
        tl.to(S, { py: 0.05, duration: 0.4, ease: 'power2.out' }, 4.8);
        // после оборота — «Спасибо! Заявка отправлена»
        tl.fromTo(S, { ok: -1 }, { ok: 0, duration: 0.001, immediateRender: false }, 4.8);
        tl.fromTo(S, { ok: 0 }, { ok: 1, duration: 1.0, ease: 'none', immediateRender: false }, 4.801);
        // плавный уход: телефон немного опускается и растворяется
        tl.to(S, { py: -0.85, duration: 0.5, ease: 'power2.in' }, 6.45);
        tl.to('#p2-gl', { opacity: 0, duration: 0.45, ease: 'power2.in' }, 6.5);
        CAPS.build(tl, root, T0);
        tl.eventCallback('onUpdate', render);

        Promise.all([
          PUI.loadSeq('assets/seq/form', 43).then(function (a) { seqs.form = a; }),
          PUI.loadSeq('assets/seq/form-ok', 11).then(function (a) { seqs.ok = a; }),
        ]).then(function () {
          phone = VI3D.phone16(scr);
          V.scene.add(phone);
          render();
          window.__timelines = window.__timelines || {};
          window.__timelines['phone2'] = tl;
        });
      })();
    </script>
  </body>
</html>
