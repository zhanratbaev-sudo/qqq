<!doctype html>
<html lang="ru" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <script src="lib/screen.js"></script>
    <script src="lib/caps.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }
      #bg { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 45%, #0a1714 0%, #040908 70%); }
    </style>
  </head>
  <body>
    <!-- WebFor · Vet.izi — промо. Всё происходит на экране ноутбука в тёмной комнате (room.html).
         Сцены экрана ставятся на дисплей через lib/screen.js (mapScreen) по общему времени ролика.
         Звук: музыка scripts/music2.py, звуки интерфейса scripts/sfx.py. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="50" data-width="1920" data-height="1080">
      <div id="bg"></div>
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="7.5" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="phone" data-composition-id="phone" data-composition-src="compositions/phone.html" data-start="7.5" data-duration="9" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="site" data-composition-id="site" data-composition-src="compositions/site.html" data-start="16.5" data-duration="6.5" data-track-index="5" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="phone2" data-composition-id="phone2" data-composition-src="compositions/phone2.html" data-start="23" data-duration="7" data-track-index="6" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="crm2" data-composition-id="crm2" data-composition-src="compositions/crm2.html" data-start="30" data-duration="9" data-track-index="7" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="sites2" data-composition-id="sites2" data-composition-src="compositions/sites2.html" data-start="39" data-duration="5" data-track-index="8" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="44" data-duration="6" data-track-index="9" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="morph" data-composition-id="morph" data-composition-src="compositions/morph.html" data-start="0" data-duration="50" data-track-index="10" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <audio id="music" class="clip" data-start="0" data-duration="50" data-track-index="20" data-volume="0.75" src="assets/music.wav"></audio>
      <audio id="sfx" class="clip" data-start="0" data-duration="50" data-track-index="21" data-volume="2.8" src="assets/sfx.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
