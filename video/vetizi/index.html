<!doctype html>
<html lang="ru" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #08110f; }
      #root { width: 100%; height: 100%; }
      #bg { position: absolute; inset: 0; background: #08110f; }
      #captions { z-index: 10; }
    </style>
  </head>
  <body>
    <!-- Vet.izi — промо для ветклиник, 40 с, без голоса: надписи + музыка + звуки действий.
         Сцены — графика справа; все надписи — compositions/captions.html.
         Музыка: scripts/music2.py, звуки: scripts/sfx.py (CC0, uisfx). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <div id="bg"></div>

      <div id="stage3d" data-composition-id="stage3d" data-composition-src="compositions/stage3d.html" data-start="0" data-duration="8.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="build" data-composition-id="build" data-composition-src="compositions/build.html" data-start="8.6" data-duration="4.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="request" data-composition-id="request" data-composition-src="compositions/request.html" data-start="13.0" data-duration="4.0" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="crm" data-composition-id="crm" data-composition-src="compositions/crm.html" data-start="17.0" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="phone3d" data-composition-id="phone3d" data-composition-src="compositions/phone3d.html" data-start="22.5" data-duration="5.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="sites" data-composition-id="sites" data-composition-src="compositions/sites.html" data-start="28.0" data-duration="5.0" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="33.0" data-duration="7.0" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="40" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <audio id="music" class="clip" data-start="0" data-duration="40" data-track-index="10" data-volume="0.75" src="assets/music.wav"></audio>
      <audio id="sfx" class="clip" data-start="0" data-duration="40" data-track-index="11" data-volume="2.8" src="assets/sfx.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
