<!doctype html>
<html lang="ru" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="lib/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #08110f; }
      #root { width: 100%; height: 100%; }
      #bg { position: absolute; inset: 0; background: #08110f; }
      #captions { z-index: 10; }
    </style>
  </head>
  <body>
    <!-- Vet.izi — промо для ветклиник. Сцены — графика справа; все надписи — compositions/captions.html.
         Тайминг привязан к голосу (vo-script.json, make-vo.sh). -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="42" data-width="1920" data-height="1080">
      <div id="bg"></div>

      <div id="stage3d" data-composition-id="stage3d" data-composition-src="compositions/stage3d.html" data-start="0" data-duration="10.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="build" data-composition-id="build" data-composition-src="compositions/build.html" data-start="10.6" data-duration="5.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="request" data-composition-id="request" data-composition-src="compositions/request.html" data-start="15.9" data-duration="5.0" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="crm" data-composition-id="crm" data-composition-src="compositions/crm.html" data-start="20.9" data-duration="6.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="phone3d" data-composition-id="phone3d" data-composition-src="compositions/phone3d.html" data-start="27.4" data-duration="7.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="34.5" data-duration="7.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="42" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <audio id="vo1" class="clip" data-start="0.3" data-duration="3.68" data-track-index="11" data-volume="1" src="assets/vo/v1.wav"></audio>
      <audio id="vo2" class="clip" data-start="4.4" data-duration="5.79" data-track-index="10" data-volume="1" src="assets/vo/v2.wav"></audio>
      <audio id="vo3" class="clip" data-start="10.8" data-duration="4.84" data-track-index="11" data-volume="1" src="assets/vo/v3.wav"></audio>
      <audio id="vo4" class="clip" data-start="16.1" data-duration="4.25" data-track-index="10" data-volume="1" src="assets/vo/v4.wav"></audio>
      <audio id="vo5" class="clip" data-start="21.8" data-duration="5.40" data-track-index="11" data-volume="1" src="assets/vo/v5.wav"></audio>
      <audio id="vo6" class="clip" data-start="27.6" data-duration="6.67" data-track-index="10" data-volume="1" src="assets/vo/v6.wav"></audio>
      <audio id="vo7" class="clip" data-start="34.8" data-duration="5.45" data-track-index="11" data-volume="1" src="assets/vo/v7.wav"></audio>
      <audio id="music" class="clip" data-start="0" data-duration="42" data-track-index="12" data-volume="0.1" data-fade-out="1.5" src="assets/music.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
