# My PetGo для iPhone: сборка на Mac в облаке GitHub и загрузка в App Store Connect (TestFlight).
# Запуск: GitHub → Actions → «My PetGo — iOS» → Run workflow.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       — Team ID (10 символов, developer.apple.com → Membership)
#   ASC_KEY_ID          — Key ID ключа App Store Connect API (роль Admin или App Manager)
#   ASC_ISSUER_ID       — Issuer ID (App Store Connect → Users and Access → Integrations)
#   ASC_KEY_P8          — содержимое файла AuthKey_XXXXXXXXXX.p8 целиком
name: My PetGo — iOS
on:
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: petgo/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости
        run: npm ci
      - name: Подготовка проекта
        env:
          PETGO_BUILD: ${{ github.run_number }}
        run: node scripts/prepare.mjs && npx cap sync ios
      - name: Ключ App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          sed -i '' "s/TEAM_ID/${{ secrets.APPLE_TEAM_ID }}/" ci/ExportOptions.plist
      - name: Сборка (архив)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
      - name: Загрузка в App Store Connect
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Убрать ключ
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
