<title>WebFor Панель</title>
<meta name="description" content="Демо админки WebFor для телефона">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #040606; }
/* Админка WebFor — Liquid Glass (как в iOS 26). Сначала телефон: нижняя стеклянная панель, листы снизу, большие заголовки.
   Всё внутри .wfa, чтобы не задевать остальную админку WordPress. */
.wfa {
  --bg: #040606; --text: #f2f7f5; --text-2: rgba(235,245,241,.72); --text-3: rgba(235,245,241,.48);
  --accent: #3fe0a0; --on-accent: #03170e; --blue: #5ab2ff; --gold: #ffd166; --red: #ff6b5e; --warn: #f5c451;
  --glass: rgba(255,255,255,.075); --glass-2: rgba(255,255,255,.07); --glass-3: rgba(255,255,255,.12);
  --rim: inset 0 1px 0 rgba(255,255,255,.18), inset 0 -1px 0 rgba(255,255,255,.04), inset 0 0 0 .5px rgba(255,255,255,.08);
  --blur: blur(28px) saturate(190%);
  --r: 22px; --r-sm: 14px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  --tabbar: 64px;
  position: relative; overflow: hidden; isolation: isolate;
  color: var(--text); background: var(--bg);
  font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; letter-spacing: -.01em;
}
.wfa *, .wfa *::before, .wfa *::after { box-sizing: border-box; }
.wfa button, .wfa input, .wfa textarea, .wfa select { font: inherit; color: inherit; letter-spacing: inherit; }
.wfa button { cursor: pointer; }
.wfa a { color: inherit; text-decoration: none; }
.wfa h1, .wfa h2, .wfa p { margin: 0; color: inherit; font-family: inherit; padding: 0; }
.wfa [hidden] { display: none !important; }
.wfa :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wfa.is-app { position: fixed; inset: 0; }
.wfa.is-embedded { height: calc(100vh - 32px - 40px); min-height: 560px; margin: 16px 20px 0 0; border-radius: 28px; }

/* фон: мягкие цветные пятна, чтобы стеклу было что «преломлять» */
.wfa-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; background: var(--bg); }

/* экраны */
.wfa-stage { position: absolute; inset: 0; }
.wfa-screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: transparent; }
.wfa-screen.is-pushed { z-index: 5; background: var(--bg); box-shadow: -20px 0 60px rgba(0,0,0,.5); }
.wfa-screen.is-pushed::before { content: ""; position: absolute; inset: 0; z-index: -1; background: inherit; }
.wfa-screen.is-pushed .wfa-scroll { background: none; }
.wfa-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: calc(var(--safe-t) + 52px) 16px calc(var(--tabbar) + var(--safe-b) + 40px); scrollbar-width: none; }
.wfa-scroll::-webkit-scrollbar { display: none; }
.wfa-screen.is-pushed .wfa-scroll { padding-bottom: calc(var(--safe-b) + 28px); }
.wfa-screen.is-chat .wfa-scroll { padding-bottom: 16px; }
.wfa-body { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.wfa .wfa-large { max-width: 640px; margin: 4px auto 18px; color: var(--text); font-size: 34px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }

/* верхняя полоса: появляется стеклом, когда большой заголовок уехал */
.wfa-nav { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 8px;
  min-height: calc(var(--safe-t) + 50px); padding: var(--safe-t) 12px 0; transition: background .25s, box-shadow .25s, -webkit-backdrop-filter .25s, backdrop-filter .25s; }
.wfa-nav-title { font-size: 17px; font-weight: 700; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .3s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wfa-nav > .wfa-nav-title { flex: 1; text-align: center; }
.wfa-nav.is-compact { background: rgba(10,14,13,.55); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 .5px 0 rgba(255,255,255,.1); }
.wfa-nav.is-compact .wfa-nav-title { opacity: 1; transform: none; }
.wfa-nav-center { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
.wfa-nav-sub { font-size: 12px; color: var(--text-3); }
.wfa-nav-actions { display: flex; gap: 6px; min-width: 76px; justify-content: flex-end; }
.wfa-back { display: inline-flex; align-items: center; gap: 0; min-width: 76px; height: 40px; padding: 0 10px 0 2px; border: 0; border-radius: 20px; background: transparent; color: var(--accent); font-size: 17px; }
.wfa-back .wfa-ico svg { width: 26px; height: 26px; stroke-width: 2.3; }

/* значки */
.wfa-ico { display: inline-grid; place-items: center; flex: none; }
.wfa-ico svg { width: 22px; height: 22px; display: block; }
.wfa-icon-btn { width: 40px; height: 40px; display: grid; place-items: center; flex: none; border: 0; border-radius: 50%; background: var(--glass-2); box-shadow: var(--rim); color: var(--text); }
.wfa-icon-btn svg { width: 20px; height: 20px; }

/* нижняя стеклянная панель */
.wfa-tabbar { position: absolute; z-index: 20; left: 50%; bottom: calc(var(--safe-b) + 10px); transform: translateX(-50%);
  width: min(calc(100% - 28px), 440px); height: var(--tabbar); display: flex; padding: 5px; border-radius: 34px;
  background: rgba(22,30,28,.55); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
  box-shadow: var(--rim), 0 12px 40px rgba(0,0,0,.45); transition: transform .45s cubic-bezier(.32,.72,0,1), opacity .3s; }
.wfa-tabbar.is-hidden { transform: translate(-50%, calc(100% + 30px)); opacity: 0; pointer-events: none; }
.wfa-tab { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 0; border-radius: 28px; background: transparent; color: var(--text-2); transition: color .25s, transform .2s; }
.wfa-tab:active { transform: scale(.92); }
.wfa-tab[aria-current=page] { color: var(--accent); }
.wfa-tab .wfa-ico svg { width: 24px; height: 24px; }
.wfa-tab-label { font-size: 11px; font-weight: 600; letter-spacing: 0; }
.wfa-tab-badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; box-shadow: 0 0 0 2px rgba(20,26,25,.9); }
.wfa-tabpill { position: absolute; z-index: 0; top: 5px; left: 0; height: calc(100% - 10px); border-radius: 28px;
  background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); transition: transform .45s cubic-bezier(.32,.72,0,1), width .45s cubic-bezier(.32,.72,0,1); }

/* сегменты (фильтры) */
.wfa-seg { position: relative; display: flex; padding: 3px; border-radius: 14px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.06); }
.wfa-seg button { position: relative; z-index: 1; flex: 1 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 0; border-radius: 11px; background: transparent; color: var(--text-2); font-size: 14px; font-weight: 600; white-space: nowrap; transition: color .2s; }
.wfa-seg button[aria-selected=true] { color: var(--text); }
.wfa-seg-thumb { position: absolute; z-index: 0; top: 3px; left: 0; height: calc(100% - 6px); border-radius: 11px; background: rgba(255,255,255,.16);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 3px 10px rgba(0,0,0,.25); transition: transform .4s cubic-bezier(.32,.72,0,1), width .4s cubic-bezier(.32,.72,0,1); }
.wfa-seg-n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-size: 12px; line-height: 20px; }
.wfa-scroll-x { overflow-x: auto; margin: 0 -16px; padding: 0 16px; scrollbar-width: none; }
.wfa-scroll-x::-webkit-scrollbar { display: none; }
.wfa-scroll-x .wfa-seg { width: max-content; min-width: 100%; }

/* группы и строки как в настройках iOS */
.wfa-group { display: flex; flex-direction: column; gap: 8px; }
.wfa .wfa-group-title { padding: 0 6px; color: var(--text); line-height: 1.25; font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.wfa-group-foot { padding: 0 6px; font-size: 13px; color: var(--text-3); }
.wfa-list { display: flex; flex-direction: column; border-radius: var(--r); overflow: hidden; background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim); }
.wfa-item { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 14px; border: 0; background: transparent; text-align: left; transition: background .15s; }
.wfa-item + .wfa-item::before, .wfa-chat-row + .wfa-chat-row::before { content: ""; position: absolute; top: 0; right: 0; left: 58px; height: .5px; background: rgba(255,255,255,.09); }
.wfa-item:not(.is-static):active { background: rgba(255,255,255,.08); }
.wfa-item-ico { width: 32px; height: 32px; display: grid; place-items: center; flex: none; border-radius: 9px; background: rgba(255,255,255,.1); color: #fff; }
.wfa-item-ico svg { width: 19px; height: 19px; }
.wfa-item-ico.is-accent { background: var(--accent); color: var(--on-accent); }
.wfa-item-ico.is-ok { background: #2fbf71; } .wfa-item-ico.is-blue { background: #3478f6; } .wfa-item-ico.is-gold { background: #f2a93b; }
.wfa-item-ico.is-red { background: #ff453a; } .wfa-item-ico.is-gray { background: #636366; }
.wfa-item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.wfa-item-main b { font-weight: 600; font-size: 16px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wfa-item-sub { font-size: 13px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wfa-item-value { flex: none; max-width: 48%; color: var(--text-3); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wfa-chev { color: rgba(235,245,241,.3); }
.wfa-chev svg { width: 18px; height: 18px; stroke-width: 2.4; }
.wfa-item.is-danger b { color: var(--red); }
.wfa-count { flex: none; min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; }

/* карточки-подсказки */
.wfa-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim); }
.wfa-card > .wfa-ico { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.1); }
.wfa-card > div { flex: 1; min-width: 0; }
.wfa-card b { display: block; font-size: 16px; }
.wfa-card p { font-size: 13px; color: var(--text-2); }
.wfa-card.is-alert > .wfa-ico { background: var(--red); color: #fff; }
.wfa-card.is-ok > .wfa-ico { background: #2fbf71; color: #fff; }
.wfa-card.is-tip > .wfa-ico { background: #3478f6; color: #fff; }
.wfa-hero { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border: 0; border-radius: var(--r); text-align: left; color: var(--on-accent);
  background: var(--accent); box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 14px 34px rgba(46,200,140,.28); transition: transform .2s; }
.wfa-hero:active { transform: scale(.98); }
.wfa-hero-ico { width: 46px; height: 46px; display: grid; place-items: center; flex: none; border-radius: 50%; background: rgba(3,23,14,.14); }
.wfa-hero-text { flex: 1; display: flex; flex-direction: column; }
.wfa-hero-text b { font-size: 17px; }
.wfa-hero-text span { font-size: 13px; opacity: .75; }
.wfa-hero .wfa-chev { color: rgba(3,23,14,.5); }

/* кнопки */
.wfa-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border: 0; border-radius: 16px;
  background: var(--glass-3); box-shadow: var(--rim); color: var(--text); font-weight: 600; font-size: 16px; white-space: nowrap; transition: transform .2s, filter .2s; }
.wfa-btn:active { transform: scale(.96); }
.wfa-btn .wfa-ico svg { width: 20px; height: 20px; }
.wfa-btn.is-primary { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 8px 22px rgba(63,224,160,.25); }
.wfa-btn.is-ghost { background: rgba(255,255,255,.09); }
.wfa-btn.is-danger { background: rgba(255,69,58,.14); color: var(--red); box-shadow: none; }
.wfa-btn.is-wide { width: 100%; }
.wfa-btn.is-small { min-height: 36px; padding: 0 14px; border-radius: 12px; font-size: 14px; }
.wfa-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* пустые состояния, загрузка */
.wfa-empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 44px 24px; text-align: center; color: var(--text-2); }
.wfa-empty .wfa-ico { width: 64px; height: 64px; border-radius: 20px; background: var(--glass-2); box-shadow: var(--rim); color: var(--text-3); }
.wfa-empty .wfa-ico svg { width: 30px; height: 30px; }
.wfa-empty b { font-size: 18px; color: var(--text); }
.wfa-empty p { font-size: 14px; max-width: 320px; }
.wfa-boot { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; color: var(--text-2); }
.wfa-spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--accent); animation: wfa-spin .8s linear infinite; }
@keyframes wfa-spin { to { transform: rotate(360deg); } }

/* чаты */
.wfa-chat-row { position: relative; display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 12px 14px; border: 0; background: transparent; text-align: left; }
.wfa-chat-row:active { background: rgba(255,255,255,.08); }
.wfa-chat-row.is-waiting { background: rgba(63,224,160,.08); }
.wfa-ava { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 50%; background: rgba(255,255,255,.12); box-shadow: var(--rim); font-weight: 700; font-size: 15px; color: var(--text-2); }
.wfa-chat-row.is-waiting .wfa-ava { background: var(--accent); color: var(--on-accent); }
.wfa-chat-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.wfa-chat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wfa-chat-top b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wfa-chat-top time { flex: none; font-size: 13px; color: var(--text-3); }
.wfa-chat-last { font-size: 14px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.wfa-pill { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; background: rgba(255,255,255,.09); color: var(--text-2); font-size: 12px; font-weight: 600; white-space: nowrap; }
.wfa-pill.is-waiting { background: var(--accent); color: var(--on-accent); }
.wfa-pill.is-live { background: rgba(245,196,81,.2); color: var(--warn); }
.wfa-msgs { display: flex; flex-direction: column; gap: 6px; max-width: 640px; margin: 0 auto; width: 100%; }
.wfa-bubble { max-width: 82%; display: flex; flex-direction: column; gap: 2px; padding: 9px 13px; border-radius: 20px; white-space: pre-wrap; word-wrap: break-word; font-size: 16px; line-height: 1.35; }
.wfa-bubble small { font-size: 11px; font-weight: 600; color: var(--text-3); }
.wfa-bubble.is-user { align-self: flex-start; background: rgba(255,255,255,.12); border-bottom-left-radius: 6px; box-shadow: var(--rim); }
.wfa-bubble.is-bot { align-self: flex-end; background: rgba(255,255,255,.06); color: var(--text-2); border-bottom-right-radius: 6px; }
.wfa-bubble.is-manager { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 6px; }
.wfa-bubble.is-manager small { color: rgba(3,23,14,.6); }
.wfa-bubble.is-typing { flex-direction: row; gap: 4px; padding: 14px 16px; }
.wfa-bubble.is-typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); animation: wfa-dot 1s infinite; }
.wfa-bubble.is-typing i:nth-child(2) { animation-delay: .15s; } .wfa-bubble.is-typing i:nth-child(3) { animation-delay: .3s; }
@keyframes wfa-dot { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
.wfa-sys { align-self: center; max-width: 90%; margin: 6px 0; padding: 6px 12px; border-radius: 12px; background: rgba(63,224,160,.12); color: #c4f5df; font-size: 13px; text-align: center; }
.wfa-sys.is-warn { background: rgba(245,196,81,.14); color: #ffe3a3; }
.wfa-chat-foot { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px calc(var(--safe-b) + 10px);
  background: rgba(10,14,13,.6); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: 0 -.5px 0 rgba(255,255,255,.1); }
.wfa-chat-foot > * { width: 100%; max-width: 640px; margin: 0 auto; }
.wfa-join-live { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--warn); }
.wfa-composer { display: flex; align-items: flex-end; gap: 8px; }
.wfa-composer-input { flex: 1; min-height: 42px; max-height: 140px; padding: 10px 16px; border: 0; border-radius: 21px; resize: none; background: rgba(255,255,255,.09); box-shadow: var(--rim); font-size: 16px !important; line-height: 1.35; outline: none; }
.wfa-composer-input::placeholder { color: var(--text-3); }
.wfa-send { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); transition: transform .2s; }
.wfa-send:active { transform: scale(.9); }
.wfa-send svg { width: 20px; height: 20px; stroke-width: 2.4; }
.wfa-chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.wfa-chip { flex: none; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: rgba(255,255,255,.09); box-shadow: var(--rim); font-size: 14px; }

/* заявки */
.wfa-cards { display: flex; flex-direction: column; gap: 12px; }
.wfa-lead { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--glass); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--rim); }
.wfa-lead-main { display: flex; flex-direction: column; gap: 3px; padding: 0; border: 0; background: transparent; text-align: left; }
.wfa-lead-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.wfa-lead-top b { font-size: 18px; }
.wfa-lead-top time { flex: none; font-size: 13px; color: var(--text-3); }
.wfa-lead-svc { font-size: 14px; color: var(--text-2); }
.wfa-lead-phone { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.wfa-lead-msg { margin-top: 4px; padding: 10px 12px; border-radius: 14px; background: rgba(255,255,255,.06); font-size: 14px; color: var(--text-2); }

/* листы снизу */
.wfa-layer { position: absolute; inset: 0; z-index: 40; pointer-events: none; }
.wfa-layer.is-on { pointer-events: auto; }
.wfa-sheet-back { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.wfa-sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: calc(100% - var(--safe-t) - 24px); margin: 0 auto; width: 100%; max-width: 640px;
  display: flex; flex-direction: column; border-radius: 30px 30px 0 0; overflow: hidden;
  background: rgba(26,34,32,.82); -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 -20px 60px rgba(0,0,0,.5); }
.wfa-sheet-head { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 14px 8px 20px; touch-action: none; cursor: grab; }
.wfa-sheet-head b { font-size: 19px; font-weight: 700; }
.wfa-grabber { position: absolute; top: 7px; left: 50%; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: rgba(255,255,255,.28); }
.wfa-sheet-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px 20px 16px; display: flex; flex-direction: column; gap: 14px; }
.wfa-sheet-foot { display: flex; flex-direction: column; gap: 8px; padding: 10px 20px calc(var(--safe-b) + 16px); }
.wfa-field { display: flex; flex-direction: column; gap: 6px; }

  function pollChat(delay, first) {

      adapter.chatApi('GET', '/chat/' + cv.id + '?after=' + after).then((d) => {
        if (chatView !== cv) return;
        const fresh = d.msgs.filter((m) => m.i > after);
        cv.st.msgs = cv.st.msgs.concat(fresh);
        if (fresh.length) drawMsgs(fresh);
        if (d.status !== cv.st.status || d.contact !== cv.st.contact) { cv.st.status = d.status; cv.st.contact = d.contact; drawJoin(); }
        const it = C.list.find((x) => x.id === cv.id); if (it) { it.unread = 0; it.status = d.status; }
        updateBadges();
      }).catch((e) => { if (first) { fail(e); pop(); } }).then(() => { if (chatView === cv) pollChat(document.hidden ? 15000 : 2500); });
    }, delay || 0);

      out.push(h('div', { class: 'wfa-card is-alert' }, [ico('bell'), h('div', null, [h('b', { text: 'Включите уведомления' }), h('p', { text: 'Чтобы сразу узнавать, когда клиенту нужен менеджер.' })]),
        btn('Включить', () => enablePush(), 'is-small is-primary')]));
    }

  }
  function b64ToBytes(s) {
    const pad = '='.repeat((4 - (s.length % 4)) % 4), raw = atob((s + pad).replace(/-/g, '+').replace(/_/g, '/'));

  }
  function subscribePush() {
    if (CFG.demo) return Promise.reject(new Error('Это демо — на вашем сайте здесь включаются уведомления на телефон'));

    if (!CFG.chats || !CFG.chats.vapid) return Promise.reject(new Error('Ключи уведомлений не созданы на сервере'));
    return Notification.requestPermission().then((p) => {

    });
  }
  const joinKB = (items) => items.filter((i) => i.title.trim() || i.body.trim())

  function openTest() {
    if (!HAS_CHATS) { toast('Нужен плагин WebFor AI Assistant', true); return; }
    const log = h('div', { class: 'wfa-msgs' });
    const ta = h('textarea', { class: 'wfa-composer-input', rows: 1, placeholder: 'Спросите как клиент', 'aria-label': 'Вопрос ассистенту', enterkeyhint: 'send' });
    const form = h('form', { class: 'wfa-composer' }, [ta, h('button', { type: 'submit', class: 'wfa-send', 'aria-label': 'Отправить', html: I.send })]);
    const chipsBox = h('div', { class: 'wfa-chips' }, ['Сколько стоит сайт?', 'Сделаете скидку?', 'Какие сроки?'].map((t) => h('button', { type: 'button', class: 'wfa-chip', text: t, onclick: () => ask(t) })));
    const v = pushView('Проверка', { backLabel: 'Обучение', footer: h('div', { class: 'wfa-chat-foot' }, [chipsBox, form]), cls: 'is-chat' });
    v.body.append(h('p', { class: 'wfa-sys', text: 'Это проверка: клиенты её не видят, вопросы никуда не сохраняются.' }), log);
    const hist = [];
    let busy = false;
    function bubble(r, t, note) {
      const n = h('div', { class: 'wfa-bubble is-' + (r === 'user' ? 'user' : 'bot') }, [h('small', { text: r === 'user' ? 'Вы как клиент' : 'Ассистент' }), h('span', { text: t })]);
      log.appendChild(n); if (note) log.appendChild(h('p', { class: 'wfa-sys is-warn', text: note }));
      anim(n, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 300 });
      v.scroller.scrollTop = v.scroller.scrollHeight;
    }
    function ask(t) {
      t = t.trim(); if (!t || busy) return;
      busy = true; chipsBox.hidden = true; bubble('user', t);
      const typing = h('div', { class: 'wfa-bubble is-bot is-typing' }, [h('i'), h('i'), h('i')]); log.appendChild(typing);
      v.scroller.scrollTop = v.scroller.scrollHeight;
      adapter.chatApi('POST', '/test', { text: t, history: hist.slice(-10) }).then((r) => {
        typing.remove();
        hist.push({ role: 'user', content: t }, { role: 'assistant', content: r.reply });
        bubble('bot', r.reply || '—', r.escalated ? 'Здесь ассистент позвал бы вас: ' + (r.reason || 'нужен менеджер') + '. Добавьте ответ в «Готовые ответы» или «Что знает ассистент».' : r.unsupported ? 'Этот язык ассистент не поддерживает.' : null);
      }).catch((e) => { typing.remove(); fail(e); }).then(() => { busy = false; });
    }
    form.addEventListener('submit', (e) => { e.preventDefault(); const t = ta.value; ta.value = ''; ask(t); });
    push(v);
  }

  /* ================= ЕЩЁ ================= */
  function viewMore(body) {
    const rowsN = [];
    if (HAS_CHATS && !embedded) {
      const p = pushState();
      rowsN.push(row({ icon: 'bell', tint: p === 'granted' ? 'ok' : 'red', title: 'Уведомления', value: p === 'granted' ? 'Включены' : p === 'denied' ? 'Запрещены' : p === 'unsupported' ? 'Недоступны' : 'Выключены',
        onclick: () => (p === 'granted' ? subscribePush().then(() => adapter.chatApi('POST', '/push/test')).then((r) => toast(r.sent ? 'Тестовое уведомление отправлено' : 'Не дошло — нажмите ещё раз', !r.sent)).catch(fail)
          : p === 'denied' ? toast('Разрешите уведомления для этого сайта в настройках телефона', true) : enablePush()) }));
      rowsN.push(row({ icon: 'install', tint: 'blue', title: 'Как установить на телефон', onclick: installSheet }));
    } else if (HAS_CHATS && CFG.app) {
      rowsN.push(row({ icon: 'install', tint: 'blue', title: 'Админка на телефоне', sub: 'Установите и получайте уведомления', href: CFG.app, blank: true }));
    }
    if (rowsN.length) body.appendChild(group('Телефон', rowsN, 'Уведомление приходит, когда ассистент зовёт менеджера или клиент пишет в чат, где вы уже есть. Нажмите на «Включены», чтобы проверить.'));
    body.appendChild(group('Контакты на сайте', [
      row({ icon: 'phone', tint: 'accent', title: 'Телефон', value: S.settings.phone || '—', onclick: numbersSheet }),
      row({ icon: 'wa', tint: 'ok', title: 'WhatsApp', value: S.settings.whatsapp || '—', onclick: numbersSheet }),
    ], 'Меняются на всём сайте сразу.'));
    body.appendChild(group('Сайт', [
      row({ icon: 'grid', tint: 'blue', title: 'Работы в папках', value: String(S.works.length), onclick: openWorks }),
      row({ icon: 'globe', tint: 'blue', title: 'Открыть сайт', href: S.site_url, blank: true }),
      S.ai && S.ai.settings_url ? row({ icon: 'gear', tint: 'gray', title: 'Ключ и модель ассистента', href: S.ai.settings_url, blank: !embedded }) : null,
    ]));
    if (CFG.logout) body.appendChild(group(null, [row({ icon: 'logout', tint: 'red', title: 'Выйти', href: CFG.logout, chevron: false, cls: 'is-danger' })]));
  }
  function numbersSheet() {
    const ph = inputEl(S.settings.phone, 'tel'), wa = inputEl(S.settings.whatsapp, 'tel');
    const sh = sheet('Контакты на сайте', [field('Телефон для звонков', ph), field('Номер WhatsApp', wa, 'Телефон и WhatsApp независимы: поменяли один — второй остался прежним.')], { actions: [
      btn('Сохранить', () => adapter.api('POST', '/settings', { phone: ph.value, whatsapp: wa.value }).then((r) => { S.settings = r; sh.close(); render('more'); toast('Номера обновлены на сайте'); }).catch(fail), 'is-wide is-primary'),
    ] });
  }
  function installSheet() {
    sheet('Установить на телефон', [h('ol', { class: 'wfa-steps' }, isIOS ? [
      h('li', { text: 'Откройте эту страницу в Safari.' }), h('li', { text: 'Нажмите «Поделиться» (квадрат со стрелкой) внизу экрана.' }),
      h('li', { text: 'Выберите «На экран Домой» → «Добавить».' }), h('li', { text: 'Откройте админку со значка WebFor и включите уведомления.' }),
    ] : [
      h('li', { text: 'Откройте эту страницу в Chrome.' }), h('li', { text: 'Меню ⋮ → «Установить приложение» (или «Добавить на главный экран»).' }),
      h('li', { text: 'Откройте админку со значка WebFor и включите уведомления.' }),
    ])]);
  }
  let worksFolder = null;
  function openWorks() {
    let draw = () => {};
    const v = pushView('Работы', { backLabel: 'Ещё', actions: [h('button', { type: 'button', class: 'wfa-icon-btn', 'aria-label': 'Добавить работу', html: I.plus, onclick: () => workSheet(null, draw) })] });
    worksFolder = worksFolder || (S.folders[0] && S.folders[0].key);
    draw = () => {
      v.body.innerHTML = '';
      v.body.appendChild(h('div', { class: 'wfa-scroll-x' }, segmented(S.folders.map((f) => [f.key, f.title.replace(/ — .*/, ''), S.works.filter((w) => w.folder === f.key).length]), worksFolder, (k) => { worksFolder = k; draw(); })));
      const list = S.works.filter((w) => w.folder === worksFolder);
      if (!list.length) { v.body.appendChild(empty('grid', 'Папка пустая', 'Нажмите «+» вверху, чтобы добавить работу.')); return; }
      v.body.appendChild(h('div', { class: 'wfa-works' }, list.map((w, i) => h('div', { class: 'wfa-work' }, [
        h('button', { type: 'button', class: 'wfa-work-open', onclick: () => workSheet(w, draw) }, [
          h('span', { class: 'wfa-work-img' + (w.shape === 'phone' ? ' is-phone' : '') }, w.src ? h('img', { src: w.src, alt: '', loading: 'lazy' }) : ico('image')),
          h('b', { text: w.title }), h('small', { text: w.tag || '' }),
        ]),
        h('div', { class: 'wfa-work-move' }, [
          h('button', { type: 'button', 'aria-label': 'Раньше', disabled: i === 0, html: I.back, onclick: () => moveWork(list, i, -1, draw) }),
          h('button', { type: 'button', 'aria-label': 'Позже', disabled: i === list.length - 1, html: I.next, onclick: () => moveWork(list, i, 1, draw) }),
        ]),
      ]))));
    };
    draw();
    push(v);
  }
  function moveWork(list, i, dir, draw) {
    const arr = list.slice(); const [m] = arr.splice(i, 1); arr.splice(i + dir, 0, m);
    S.works = S.works.filter((w) => w.folder !== worksFolder).concat(arr);
    draw();
    adapter.api('POST', '/works/order', { ids: arr.map((w) => w.id) }).then(() => toast('Порядок сохранён')).catch(fail);
  }
  function workSheet(w, draw) {
    const d = Object.assign({ id: 0, title: '', folder: worksFolder, tag: 'Наш проект', desc: '', url: '', shape: worksFolder === 'sites' || worksFolder === 'izi' ? 'wide' : 'phone', image_id: 0, src: '' }, w || {});
    const prev = h('button', { type: 'button', class: 'wfa-img-pick', onclick: () => adapter.pickImage().then((img) => { if (img) { d.image_id = img.id; d.src = img.url; drawPrev(); } }) });
    function drawPrev() { prev.innerHTML = ''; prev.classList.toggle('is-phone', d.shape === 'phone'); prev.appendChild(d.src ? h('img', { src: d.src, alt: 'Скриншот' }) : h('span', null, [ico('image'), 'Выбрать скриншот'])); }
    drawPrev();
    const title = inputEl(d.title, 'text', 'Например: Сайт ветклиники');
    const folder = h('select', { class: 'wfa-input' }, S.folders.map((f) => h('option', { value: f.key, selected: f.key === d.folder, text: f.title })));
    const shape = h('select', { class: 'wfa-input', onchange: () => { d.shape = shape.value; drawPrev(); } }, [h('option', { value: 'wide', selected: d.shape !== 'phone', text: 'Сайт / компьютер' }), h('option', { value: 'phone', selected: d.shape === 'phone', text: 'Телефон' })]);
    const tag = inputEl(d.tag, 'text', 'Наш проект'); const desc = area(d.desc, 3, 'Что сделали и чем полезно клиенту'); const url = inputEl(d.url, 'url', 'https://');
    const sh = sheet(d.id ? 'Работа' : 'Новая работа', [prev, field('Название', title), field('Папка', folder), field('Вид скриншота', shape), field('Метка', tag), field('Описание', desc), field('Ссылка', url)], { actions: [
      btn('Сохранить', () => {
        if (!title.value.trim()) { title.focus(); toast('Укажите название', true); return; }
        adapter.api('POST', '/work', { id: d.id, title: title.value.trim(), folder: folder.value, shape: shape.value, tag: tag.value, desc: desc.value, url: url.value, image_id: d.image_id || 0, src: d.src }).then((saved) => {
          if (!saved.src && d.src) saved.src = d.src;
          const k = S.works.findIndex((x) => x.id === saved.id);
          if (k >= 0) S.works[k] = saved; else S.works.push(saved);
          worksFolder = saved.folder; sh.close(); draw(); toast('Сохранено — уже на сайте');
        }).catch(fail);
      }, 'is-wide is-primary'),
      d.id ? confirmBtn('Удалить работу', () => adapter.api('DELETE', '/work/' + d.id).then(() => { S.works = S.works.filter((x) => x.id !== d.id); sh.close(); draw(); toast('Работа удалена'); }).catch(fail)) : null,
    ] });
  }

  /* ---------- запуск ---------- */
  stage.appendChild(h('div', { class: 'wfa-boot' }, [h('span', { class: 'wfa-spinner' }), 'Загружаем…']));
  Promise.all([adapter.api('GET', '/state'), HAS_CHATS ? adapter.chatApi('GET', '/chats').catch(() => ({ chats: [] })) : null]).then(([state, chats]) => {
    S = state; if (chats) setChats(chats.chats || []);
    const boot = stage.querySelector('.wfa-boot'); if (boot) boot.remove();
    const m = /^#chat-(\d+)$/.exec(location.hash);
    if (m && HAS_CHATS) tab = 'chats';
    setTab(tab, true);
    requestAnimationFrame(movePill);
    if (m && HAS_CHATS) openChat(+m[1], true);
    if (HAS_CHATS) pollList();
    if (CFG.demo) setTimeout(() => toast('Демо: данные — примеры, ничего не сохраняется'), 600);
  }).catch((e) => {
    stage.innerHTML = '';
    stage.appendChild(empty('close', 'Не удалось загрузить', e.message));
  });
})();
</script>
